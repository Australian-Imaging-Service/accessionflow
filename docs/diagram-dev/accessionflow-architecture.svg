<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740">
<title>accessionflow architecture</title>
<g id="background">
  <rect x="0" y="0" width="1240" height="740" rx="16" fill="#FFFFFF" stroke="#E2E7EE" stroke-width="1"/>
</g>
<g id="title">
  <text x="40" y="54" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#172033" text-anchor="start">accessionflow architecture</text>
  <text x="40" y="81" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">A small core of stages, driven by interfaces above and extended by plugins below</text>
</g>
<g id="layer-interfaces">
  <rect x="40" y="116" width="1160" height="116" rx="16" fill="#F5F7FA" stroke="none" stroke-width="0"/>
  <text x="64" y="146" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5A6478" text-anchor="start">INTERFACES</text>
  <g id="cli">
  <rect x="250" y="144" width="260" height="62" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  <text x="380.0" y="172.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">Command line</text>
  <text x="380.0" y="191.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#5A6478" text-anchor="middle">accessionflow &lt;stage&gt; …</text>
</g>
  <g id="prefect">
  <rect x="540" y="144" width="260" height="62" rx="10" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="670.0" y="172.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">Prefect flows</text>
  <text x="670.0" y="191.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#B45309" text-anchor="middle">orchestration &amp; scheduling</text>
</g>
  <g id="yaml">
  <rect x="830" y="144" width="260" height="62" rx="10" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="960.0" y="172.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">Deployment config</text>
  <text x="960.0" y="191.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#B45309" text-anchor="middle">constrained YAML</text>
</g>
</g>
