  <text x="460.0" y="388.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">Shared data model</text>
  <text x="460.0" y="407.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5A6478" text-anchor="middle">sessions · series · resources</text>
</g>
  <g id="core-staging">
  <rect x="690" y="358" width="420" height="66" rx="10" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.5"/>
  <text x="900.0" y="388.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">Staging storage</text>
  <text x="900.0" y="407.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5A6478" text-anchor="middle">local filesystem or S3</text>
</g>
</g>
<g id="arrow-core-plugins">
  <line x1="620.0" y1="456" x2="620.0" y2="474.0" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <polygon points="620.0,482.0 625.0,473.0 615.0,473.0" fill="#475569"/>
</g>
<g id="layer-plugins">
