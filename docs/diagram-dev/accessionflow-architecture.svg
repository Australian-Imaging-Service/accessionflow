  <text x="566.0" y="576.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#B45309" text-anchor="middle">store &lt;repo&gt;</text>
</g>
  <text x="710" y="516" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172033" text-anchor="start">Data types</text>
  <g id="type-dicom">
  <rect x="710" y="532" width="120" height="56" rx="10" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.5"/>
  <text x="770.0" y="565.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">DICOM</text>
</g>
  <g id="type-biosignals">
  <rect x="842" y="532" width="120" height="56" rx="10" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="902.0" y="565.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">Biosignals</text>
</g>
  <g id="type-omics">
  <rect x="974" y="532" width="136" height="56" rx="10" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1042.0" y="565.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">Bioinformatics</text>
</g>
  <text x="250" y="632" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5A6478" text-anchor="start">Plugins are installed per deployment, so a site only carries the repositories and data types it uses.</text>
</g>
<g id="legend">
  <rect x="40" y="700" width="26" height="16" rx="4" fill="#FFFFFF" stroke="#475569" stroke-width="1.4"/>
  <text x="76" y="713" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5A6478" text-anchor="start">Available</text>
  <rect x="160" y="700" width="26" height="16" rx="4" fill="#FEF3E2" stroke="#B45309" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="196" y="713" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5A6478" text-anchor="start">Planned / exploratory</text>
</g>
