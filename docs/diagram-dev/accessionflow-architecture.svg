  <polygon points="832.0,311.0 823.0,306.1 823.0,315.9" fill="#0E7C86"/>
</g>
  <g id="core-store">
  <rect x="980" y="288" width="132" height="46" rx="23" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.6"/>
  <text x="1046.0" y="316" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0A5C63" text-anchor="middle">store</text>
