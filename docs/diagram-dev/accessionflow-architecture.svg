</g>
  <g id="arrow-3">
  <line x1="676" y1="311" x2="678.0" y2="311.0" stroke="#0E7C86" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="686.0,311.0 677.0,306.1 677.0,315.9" fill="#0E7C86"/>
