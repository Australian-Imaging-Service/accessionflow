  <text x="250" y="516" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172033" text-anchor="start">Repository plugins — provide the store subcommands</text>
  <g id="plugin-xnat">
  <rect x="250" y="532" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.5"/>
  <text x="350.0" y="557.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">XNAT</text>
  <text x="350.0" y="576.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#5A6478" text-anchor="middle">store xnat</text>
</g>
  <g id="plugin-other-repos">
