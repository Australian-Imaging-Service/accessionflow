<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420">
<title>accessionflow pipeline overview</title>
<g id="background">
  <rect x="0" y="0" width="1440" height="420" rx="16" fill="#FFFFFF" stroke="#E2E7EE" stroke-width="1"/>
</g>
<g id="title">
  <text x="40" y="54" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#172033" text-anchor="start">accessionflow</text>
  <text x="40" y="81" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">From instrument to repository through configurable, reorderable stages</text>
</g>
<g id="source">
  <rect x="40" y="140" width="156" height="168" rx="14" fill="#EEF1F5" stroke="#475569" stroke-width="1.5"/>
  <g id="scanner-icon">
  <rect x="81.9" y="168.55" width="72.2" height="58.9" rx="13.299999999999999" fill="#FFFFFF" stroke="#475569" stroke-width="1.8"/>
  <circle cx="118" cy="196.1" r="19.0" fill="#EEF1F5" stroke="#475569" stroke-width="1.8"/>
  <rect x="101.66" y="203.7" width="32.68" height="4.75" rx="2.375" fill="#475569" stroke="none" stroke-width="0"/>
  <rect x="89.5" y="225.55" width="57.0" height="5.699999999999999" rx="2.8499999999999996" fill="#475569" stroke="none" stroke-width="0"/>
</g>
  <text x="118" y="264" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">Instrument</text>
  <text x="118" y="284" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5A6478" text-anchor="middle">DICOM &amp; raw data</text>
</g>
<g id="arrow-source">
  <line x1="200" y1="224.0" x2="232.0" y2="224.0" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <polygon points="240.0,224.0 231.0,219.1 231.0,228.9" fill="#475569"/>
</g>
<g id="stages">
  <g id="stage-collate">
  <rect x="244" y="140" width="140" height="168" rx="14" fill="#E3F3F4" stroke="#0E7C86" stroke-width="1.8"/>
  <circle cx="314.0" cy="172" r="14" fill="#0E7C86"/>
  <text x="314.0" y="177" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="314.0" y="216" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#0A5C63" text-anchor="middle">collate</text>
  <text x="314.0" y="241" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6478" text-anchor="middle">Group files into</text>
  <text x="314.0" y="258" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6478" text-anchor="middle">sessions &amp; series</text>
</g>
  <g id="stage-attach">
  <rect x="408" y="140" width="140" height="168" rx="14" fill="#E3F3F4" stroke="#0E7C86" stroke-width="1.8"/>
  <circle cx="478.0" cy="172" r="14" fill="#0E7C86"/>
  <text x="478.0" y="177" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="478.0" y="216" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#0A5C63" text-anchor="middle">attach</text>
  <text x="478.0" y="241" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6478" text-anchor="middle">Link non-DICOM</text>
  <text x="478.0" y="258" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6478" text-anchor="middle">files to sessions</text>
</g>
  <g id="arrow-attach">
  <line x1="388" y1="224.0" x2="396.0" y2="224.0" stroke="#0E7C86" stroke-width="2" stroke-linecap="round"/>
  <polygon points="404.0,224.0 395.0,219.1 395.0,228.9" fill="#0E7C86"/>
</g>
  <g id="stage-label">
  <rect x="572" y="140" width="140" height="168" rx="14" fill="#E3F3F4" stroke="#0E7C86" stroke-width="1.8"/>
  <circle cx="642.0" cy="172" r="14" fill="#0E7C86"/>
  <text x="642.0" y="177" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="642.0" y="216" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#0A5C63" text-anchor="middle">label</text>
  <text x="642.0" y="241" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6478" text-anchor="middle">Assign project,</text>
  <text x="642.0" y="258" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6478" text-anchor="middle">subject, session IDs</text>
</g>
  <g id="arrow-label">
  <line x1="552" y1="224.0" x2="560.0" y2="224.0" stroke="#0E7C86" stroke-width="2" stroke-linecap="round"/>
  <polygon points="568.0,224.0 559.0,219.1 559.0,228.9" fill="#0E7C86"/>
</g>
  <g id="stage-deidentify">
  <rect x="736" y="140" width="140" height="168" rx="14" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.8" stroke-dasharray="6 5"/>
  <circle cx="806.0" cy="172" r="14" fill="#0E7C86"/>
  <text x="806.0" y="177" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="806.0" y="216" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#0A5C63" text-anchor="middle">deidentify</text>
  <text x="806.0" y="241" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6478" text-anchor="middle">Remove identifying</text>
  <text x="806.0" y="258" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6478" text-anchor="middle">header metadata</text>
  <g id="tag">
  <rect x="771.28" y="274" width="69.44" height="19.5" rx="9.75" fill="#E3F3F4" stroke="none" stroke-width="0"/>
  <text x="806.0" y="287.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0A5C63" text-anchor="middle">OPTIONAL</text>
</g>
</g>
  <g id="arrow-deidentify">
  <line x1="716" y1="224.0" x2="724.0" y2="224.0" stroke="#0E7C86" stroke-width="2" stroke-linecap="round"/>
  <polygon points="732.0,224.0 723.0,219.1 723.0,228.9" fill="#0E7C86"/>
</g>
  <g id="stage-package">
  <rect x="900" y="140" width="140" height="168" rx="14" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.8" stroke-dasharray="6 5"/>
  <circle cx="970.0" cy="172" r="14" fill="#0E7C86"/>
  <text x="970.0" y="177" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="970.0" y="216" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#0A5C63" text-anchor="middle">package</text>
  <text x="970.0" y="241" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6478" text-anchor="middle">Bundle data for the</text>
  <text x="970.0" y="258" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6478" text-anchor="middle">target repository</text>
  <g id="tag-2">
  <rect x="935.28" y="274" width="69.44" height="19.5" rx="9.75" fill="#E3F3F4" stroke="none" stroke-width="0"/>
  <text x="970.0" y="287.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0A5C63" text-anchor="middle">OPTIONAL</text>
</g>
</g>
  <g id="arrow-package">
  <line x1="880" y1="224.0" x2="888.0" y2="224.0" stroke="#0E7C86" stroke-width="2" stroke-linecap="round"/>
  <polygon points="896.0,224.0 887.0,219.1 887.0,228.9" fill="#0E7C86"/>
</g>
  <g id="stage-store">
  <rect x="1064" y="140" width="140" height="168" rx="14" fill="#E3F3F4" stroke="#0E7C86" stroke-width="1.8"/>
  <circle cx="1134.0" cy="172" r="14" fill="#0E7C86"/>
  <text x="1134.0" y="177" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="1134.0" y="216" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#0A5C63" text-anchor="middle">store</text>
  <text x="1134.0" y="241" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6478" text-anchor="middle">Upload to the</text>
  <text x="1134.0" y="258" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6478" text-anchor="middle">repository</text>
</g>
  <g id="arrow-store">
  <line x1="1044" y1="224.0" x2="1052.0" y2="224.0" stroke="#0E7C86" stroke-width="2" stroke-linecap="round"/>
  <polygon points="1060.0,224.0 1051.0,219.1 1051.0,228.9" fill="#0E7C86"/>
</g>
</g>
<g id="arrow-repositories">
  <line x1="1208" y1="224.0" x2="1224.0" y2="224.0" stroke="#4338CA" stroke-width="2" stroke-linecap="round"/>
  <polygon points="1232.0,224.0 1223.0,219.1 1223.0,228.9" fill="#4338CA"/>
</g>
<g id="repositories">
  <rect x="1236" y="140" width="164" height="168" rx="14" fill="#EEF0FD" stroke="#4338CA" stroke-width="1.5"/>
  <text x="1318.0" y="170" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">Repositories</text>
  <rect x="1250" y="186" width="136" height="30" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.2"/>
  <text x="1318.0" y="206" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4338CA" text-anchor="middle">XNAT</text>
  <rect x="1250" y="224" width="136" height="30" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.2"/>
  <text x="1318.0" y="244" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4338CA" text-anchor="middle">Object storage</text>
  <rect x="1250" y="262" width="136" height="30" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="1318.0" y="282" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5A6478" text-anchor="middle">Others via plugins</text>
</g>
<g id="stage-note">
  <line x1="244" y1="334" x2="1204" y2="334" stroke="#C3CBD6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="244" y1="326" x2="244" y2="334" stroke="#C3CBD6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="1204" y1="326" x2="1204" y2="334" stroke="#C3CBD6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="724.0" y1="334" x2="724.0" y2="342" stroke="#C3CBD6" stroke-width="1.5" stroke-linecap="round"/>
  <text x="724.0" y="364" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5A6478" text-anchor="middle">Each stage is a standalone command — stages are configured per deployment and can be reordered</text>
</g>
</svg>
